# Builds the static site (model runs in the visitor's browser) and publishes it on GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Export the LATEST trained model (backend/artifacts) to JSON for the browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export model for the browser
        env:
          SENTIMENT_ARTIFACTS_DIR: ${{ github.workspace }}/backend/artifacts
        run: |
          pip install "scikit-learn==1.9.1" joblib numpy pydantic pydantic-settings
          pip install --no-deps ./backend
          python -m review_sentiment.ml.web_export --out frontend/public/model

      # 2. Build the React app with the in-browser engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        env:
          VITE_ENGINE: browser
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
