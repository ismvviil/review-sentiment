<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classify product reviews as positive, neutral or negative." />
    <title>Review Sentiment</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode)
      try {
        const t = JSON.parse(localStorage.getItem('rs.theme') || '"system"')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
