[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "review-sentiment"
version = "2.0.0"
description = "Product-review sentiment classification: sentence embeddings + classical ML, served by FastAPI."
requires-python = ">=3.12"
# Core = what the API needs. Pick an embedding runtime with an extra:
#   pip install -e ".[train,dev]"   development + training (PyTorch / sentence-transformers)
#   pip install ".[onnx]"           lightweight serving (ONNX Runtime, no PyTorch, ~5x less RAM)
# PyTorch is smaller as the CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]

[project.optional-dependencies]
train = ["sentence-transformers>=3.0", "pandas>=2.2"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19", "huggingface-hub>=0.23"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sentiment-train = "review_sentiment.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs the real trained model and sentence-transformer weights"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
